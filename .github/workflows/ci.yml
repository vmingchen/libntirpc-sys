name: Rust bindings
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable
        with:
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config liburcu-dev libkrb5-dev
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - name: Verify packaged native source
        run: cargo package --locked
      - name: Test the exact packaged source offline
        run: cargo test --offline --manifest-path target/package/libntirpc-sys-0.3.0/Cargo.toml --all-features
      - name: Verify docs.rs declarations
        run: DOCS_RS=1 RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
      - name: Verify docs mode does not contaminate native builds
        run: cargo test --all-features
      - name: Check Rust 1.88 MSRV
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --all-targets --all-features

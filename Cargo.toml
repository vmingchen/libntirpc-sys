# This repository is the authoritative source of libntirpc-sys.
# VFSI consumes published releases or an explicit local Cargo path override.
[package]
name = "libntirpc-sys"
version = "0.3.4"
edition = "2024"
rust-version = "1.88"
authors = ["Ming Chen <v.mingchen@gmail.com>"]
description = "Low-level bindings for the libntirpc library."
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/vmingchen/libntirpc-sys"
keywords = [
    "xdr",
    "rpc",
    "tirpc",
    "ntirpc",
    "nfs",
]
build = "build.rs"
links = "ntirpc"
exclude = ["*.swp", "*.swo"]

# Everything is explicitly listed: no build-generated examples, tests, or
# binaries are picked up implicitly.
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[features]
default = []
fuzzing = []
rpcsec-gss = []

[lib]
name = "libntirpc_sys"
path = "src/lib.rs"

[[example]]
name = "hello_client"
path = "examples/hello_client.rs"

[[example]]
name = "hello_server"
path = "examples/hello_server.rs"

[dev-dependencies]
libc = "0.2"

[[test]]
name = "source_contract"
path = "tests/source_contract.rs"

[[bench]]
name = "xdr_throughput"
path = "benches/xdr_throughput.rs"
harness = false

[[bench]]
name = "xdr_allocations"
path = "benches/xdr_allocations.rs"
harness = false

[build-dependencies]
cc = "1"
bindgen = { version = "=0.73.2", default-features = false, features = ["runtime"] }
pkg-config = "0.3"

[[bench]]
name = "rpc_string_overhead"
path = "benches/rpc_string_overhead.rs"
harness = false
